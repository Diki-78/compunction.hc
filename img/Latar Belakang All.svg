      <path d="M0 2 76 1 80 46 0 47ZM83 1 193 2 195 46 85 46ZM200 2 300 1 300 47 202 46Z
               M0 52 126 51 129 97 0 98ZM135 52 218 51 220 97 137 97ZM227 51 300 52 300 97 229 97Z
               M0 103 72 102 74 148 0 149ZM81 102 183 103 185 148 83 148ZM192 103 300 102 300 148 194 148Z"
