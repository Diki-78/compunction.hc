      <path d="M0 0 77 0M84 0 193 0M201 0 300 0M0 50 126 50M136 50 219 50M228 50 300 50M0 100 73 100M82 100 184 100M193 100 300 100"
            fill="none" stroke="#303030" stroke-width="2"/>
      <path d="M1 4 75 3M86 4 191 3M203 4 298 3M2 54 124 53M139 54 216 53M231 54 298 53M2 105 70 104M85 105 181 104M196 105 298 104"
            fill="none" stroke="#424242" stroke-width="1" opacity=".28"/>
      <path d="m18 38 15-3m50 6 22-4m29-1 18 2m26-4 27 3M14 87l24-4m43 8 19-4m75-25 13-3m43 27 24 3m-204 48 17-3m62 4 24-5m45 1 17-4m41 5 18-3"
